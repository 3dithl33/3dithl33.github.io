<!-- Overwrite this file with code you want before the closing body tag -->
<button id="theme-toggle" type="button" title="Toggle dark mode">🌓</button>
<script>
  (function () {
    var btn = document.getElementById('theme-toggle');

    // Move the button into the navigation bar
    var navList = document.querySelector('header nav ul') || document.querySelector('nav ul');
    if (navList) {
      var li = document.createElement('li');
      var firstItem = navList.querySelector('li');
      if (firstItem) li.className = firstItem.className;
      li.appendChild(btn);
      navList.appendChild(li);
      btn.classList.add('in-nav');
    }

    // Toggle dark mode
    btn.addEventListener('click', function () {
      var dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    });
  })();
</script>
<script>
  ['copy', 'cut', 'contextmenu'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); });
  });
</script>
