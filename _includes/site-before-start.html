<!-- Overwrite this file with code you want before the closing head tag -->
<meta name="robots" content="noindex, nofollow">

<style>
  body { -webkit-user-select: none; user-select: none; }
  html.dark { background: #fff; filter: invert(1) hue-rotate(180deg); }
  html.dark img, html.dark video, html.dark iframe { filter: invert(1) hue-rotate(180deg); }
  #theme-toggle {
    position: fixed; right: 16px; bottom: 16px; z-index: 999;
    padding: 8px 14px; border: 1px solid #ccc; border-radius: 20px;
    background: #fff; color: #222; font: 14px sans-serif; cursor: pointer;
  }
.blog-index { display: grid; grid-template-columns: 170px 1fr; gap: 2.5rem; }
.blog-index__side { position: sticky; top: 6rem; align-self: start; margin-top: 4rem; font-size: 0.8em; }
.blog-index__side ul { list-style: none; padding: 0; margin: .5rem 0 0; }
.blog-index__side li { margin-bottom: .4rem; }
.blog-index__side a.active { font-weight: bold; text-decoration: none; }
.blog-index__post { margin-bottom: 2.5rem; }
.blog-index__meta { opacity: .7; font-size: .9em; }
@media (max-width: 800px) {
  .blog-index { grid-template-columns: 1fr; }
  .blog-index__side { position: static; }
}
</style>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
