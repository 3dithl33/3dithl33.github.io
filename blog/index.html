---
layout: page
title: Blog
---
{% assign cats = site.categories | sort %}
<div class="blog-index">
  <aside class="blog-index__side">
    <strong>Categories</strong>
    <ul>
      <li><a href="#" data-cat="all" class="active">All</a></li>
      {% for cat in cats %}
      <li><a href="#" data-cat="{{ cat[0] | slugify }}">{{ cat[0] }}</a></li>
      {% endfor %}
    </ul>
  </aside>

  <div class="blog-index__main">
    <ul>
    {% for post in site.posts %}
      <li class="blog-index__post" data-cats="{% for c in post.categories %}{{ c | slugify }} {% endfor %}">
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a> · {{ post.date | date: "%-d %b %Y" }}
      </li>
    {% endfor %}
    </ul>
  </div>
</div>

<script>
  var links = document.querySelectorAll('.blog-index__side a');
  links.forEach(function (link) {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      var cat = link.dataset.cat;
      document.querySelectorAll('.blog-index__post').forEach(function (p) {
        var match = cat === 'all' || p.dataset.cats.split(' ').indexOf(cat) > -1;
        p.style.display = match ? '' : 'none';
      });
      links.forEach(function (l) { l.classList.toggle('active', l === link); });
    });
  });
</script>
